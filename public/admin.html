<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library Admin - Import Paper</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --text: #333;
            --primary: #4CAF50;
            --card-bg: #fff;
            --border: #ddd;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --text: #eee;
                --primary: #45a049;
                --card-bg: #2d2d2d;
                --border: #444;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }
        h2 { margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .error { color: #ff5252; }
        .success { color: var(--primary); }
        .nav-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Import Paper (AI)</h2>
            <p>Upload a .pdf or .docx paper to automatically extract questions using Gemini.</p>
            
            <div class="form-group">
                <label for="fileInput">Select Paper:</label>
                <input type="file" id="fileInput" accept=".pdf,.docx">
            </div>
            
            <button id="importBtn">Start AI Import</button>
            
            <div id="status"></div>
            
            <a href="/" class="nav-link">← Back to Library</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const importBtn = document.getElementById('importBtn');
        const status = document.getElementById('status');

        importBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert('Please select a file first.');

            importBtn.disabled = true;
            status.style.display = 'block';
            status.innerHTML = 'Starting upload...';
            status.className = '';

            try {
                // Send raw file data
                const response = await fetch('/api/import', {
                    method: 'POST',
                    headers: {
                        'x-filename': file.name,
                        'content-type': file.type || 'application/octet-stream'
                    },
                    body: file
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                status.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value);
                    status.innerHTML += text;
                    status.scrollTop = status.scrollHeight;
                }

                if (response.ok) {
                    status.classList.add('success');
                } else {
                    status.classList.add('error');
                }

            } catch (err) {
                status.innerHTML += '\nError: ' + err.message;
                status.classList.add('error');
            } finally {
                importBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

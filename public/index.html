<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2SRWNGHTMS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2SRWNGHTMS');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wycliffe Mwanganda's e-library</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

<div class="header">
    <div class="header-top">
        <img class="logo" src="/Media/images/logo.png" alt="Logo"/>
        <h1 style="cursor: default;" ondblclick="window.location.href='/admin.html'">Wycliffe's e-library</h1>
    </div>

    <nav>
        <a href="#" onclick="event.preventDefault(); loadHome()">Home</a>
        <a href="#" onclick="event.preventDefault(); loadPractice()">Practice</a>
        <a href="#" onclick="event.preventDefault(); loadAbout()">About</a>
        <a href="#" onclick="event.preventDefault(); loadRequest()">Request a Book/Paper</a>
        <button id="darkModeToggle" aria-label="Toggle dark mode">🌙</button>
    </nav>
</div>

<!-- Magic Nav (Floating Circle / Ribbon) -->
<div id="magicNav" class="magic-nav hidden">
    <div class="magic-nav-circle">
        <img src="/Media/images/logo.png" alt="Logo"/>
    </div>
    <div class="magic-nav-ribbon">
        <a href="#" onclick="event.preventDefault(); loadHome()">Home</a>
        <a href="#" onclick="event.preventDefault(); loadPractice()">Practice</a>
        <a href="#" onclick="event.preventDefault(); loadAbout()">About</a>
        <a href="#" onclick="event.preventDefault(); loadRequest()">Request</a>
        <a href="#" id="ribbonBackToTop">↑ Top</a>
    </div>
</div>

    <!-- SPA container -->
    <div id="app"></div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <p class="footer-description">Empowering students through accessible academic resources.</p>
            </div>
            <div class="footer-section">
                <h3>Library Stats</h3>
                <ul class="stats-list">
                    <li><span class="stat-icon">📚</span> <span id="total-books">Loading...</span> files available</li>
                    <li><span class="stat-icon">📅</span> Last updated: <span id="last-updated">Loading...</span></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Wycliffe Mwanganda. All rights reserved.</p>
        </div>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
